<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Eric Shop PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(20, 20, 25, 0.75);
            --border-color: rgba(139, 92, 246, 0.2);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f0f0f0;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

        /* PASSWORD LOGIN OVERLAY */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        .auth-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 40px; border-radius: 20px; width: 100%; max-width: 400px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .auth-card h2 { margin-bottom: 10px; font-weight: 700; color: #fff; }
        .auth-card p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 25px; }
        .auth-input {
            width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px;
            font-family: 'Poppins', sans-serif; outline: none; margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        .auth-input:focus { border-color: var(--primary); }
        .btn-auth {
            background: linear-gradient(45deg, #8b5cf6, #6d28d9); color: white;
            border: none; padding: 12px; border-radius: 8px; width: 100%;
            cursor: pointer; font-weight: 600; transition: all 0.3s;
        }
        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4); }
        .error-msg { color: #ef4444; font-size: 0.8rem; margin-top: 10px; display: none; }

        /* NAVBAR */
        .navbar {
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); padding: 15px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.5rem; color: #fff; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .badge { background: linear-gradient(45deg, #8b5cf6, #5b21b6); padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; }
        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .btn-action { background: transparent; border: 1px solid var(--primary); color: white; padding: 8px 18px; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s; }
        .btn-action:hover { background: rgba(139, 92, 246, 0.2); }

        /* DASHBOARD CONTENT */
        .container { padding: 40px 30px; max-width: 1300px; margin: 0 auto; width: 100%; flex: 1; display: none; }
        
        /* STATS SUMMARY CARDS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: var(--card-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-radius: 15px; padding: 20px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 5px;
        }
        .stat-title { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: #fff; }

        /* TABLE CONTAINER */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-header h2 { font-weight: 700; color: #fff; font-size: 1.4rem; }
        
        .table-wrapper {
            background: var(--card-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-radius: 20px; overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }
        .orders-table { width: 100%; border-collapse: collapse; text-align: left; }
        .orders-table th, .orders-table td { padding: 18px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.9rem; }
        .orders-table th { background: rgba(139, 92, 246, 0.1); color: #c084fc; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1.2px; }
        .orders-table tr:hover { background: rgba(255, 255, 255, 0.02); }
        
        .proof-img { width: 45px; height: 45px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid var(--primary); transition: transform 0.2s; }
        .proof-img:hover { transform: scale(1.15); }
        
        .btn-delete { background: linear-gradient(45deg, #ef4444, #b91c1c); color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: opacity 0.2s; }
        .btn-delete:hover { opacity: 0.8; }
        
        .empty-msg { text-align: center; padding: 50px; color: var(--text-muted); font-size: 0.95rem; }
    </style>
</head>
<body>

    <!-- PASSWORD LOGIN OVERLAY -->
    <div id="authOverlay">
        <div class="auth-card">
            <h2>Admin Restricted</h2>
            <p>Enter your password to access the orders dashboard.</p>
            <input type="password" id="adminPassInput" class="auth-input" placeholder="Enter password...">
            <button class="btn-auth" onclick="verifyPassword()">Unlock Dashboard</button>
            <div id="errorMsg" class="error-msg">Incorrect password. Please try again.</div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <header class="navbar">
        <div class="logo">Eric Shop <span class="badge">ADMIN</span></div>
        <div class="nav-actions">
            <a href="/" class="btn-action">Home</a>
            <button class="btn-action" onclick="lockDashboard()" style="border-color: #ef4444; color: #f87171;">Lock</button>
        </div>
    </header>

    <div class="container" id="dashboardContainer">
        <!-- STATS SUMMARY -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-title">Total Orders</span>
                <span class="stat-value" id="statTotalOrders">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Pending Verification</span>
                <span class="stat-value" id="statPending" style="color: #facc15;">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Total Estimated Revenue</span>
                <span class="stat-value" id="statRevenue" style="color: #c084fc;">₱ 0.00</span>
            </div>
        </div>

        <div class="section-header">
            <h2>Customer Orders List</h2>
            <button class="btn-action" onclick="loadOrders()" style="font-size: 0.8rem; padding: 6px 12px;">🔄 Refresh</button>
        </div>

        <div class="table-wrapper">
            <div style="overflow-x: auto;">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Username</th>
                            <th>Script / Item</th>
                            <th>Duration</th>
                            <th>Price</th>
                            <th>GCash #</th>
                            <th>Proof</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <!-- Dynamic items -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // PALITAN MO DITO ANG PASSWORD MO KUNG GUSTO MO
        const ADMIN_PASSWORD = "admin123"; 

        document.addEventListener("DOMContentLoaded", () => {
            if (sessionStorage.getItem("isAdminAuthenticated") === "true") {
                unlockDashboardUI();
            }
        });

        function verifyPassword() {
            const inputVal = document.getElementById("adminPassInput").value;
            const errorDiv = document.getElementById("errorMsg");

            if (inputVal === ADMIN_PASSWORD) {
                sessionStorage.setItem("isAdminAuthenticated", "true");
                unlockDashboardUI();
            } else {
                errorDiv.style.display = "block";
                document.getElementById("adminPassInput").value = "";
            }
        }

        function unlockDashboardUI() {
            document.getElementById("authOverlay").style.display = "none";
            document.getElementById("dashboardContainer").style.display = "block";
            loadOrders();
        }

        function lockDashboard() {
            sessionStorage.removeItem("isAdminAuthenticated");
            document.getElementById("authOverlay").style.display = "flex";
            document.getElementById("dashboardContainer").style.display = "none";
            document.getElementById("adminPassInput").value = "";
            document.getElementById("errorMsg").style.display = "none";
        }

        // Enter key shortcut para sa password input
        document.getElementById("adminPassInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                verifyPassword();
            }
        });

        function loadOrders() {
            const tbody = document.getElementById('ordersTableBody');
            const orders = JSON.parse(localStorage.getItem('ericShopOrders')) || [];

            // Update Stats
            document.getElementById('statTotalOrders').innerText = orders.length;
            document.getElementById('statPending').innerText = orders.length; // Lahat pending by default
            
            let totalRev = 0;
            orders.forEach(o => {
                if (o.price) {
                    const num = parseInt(o.price.replace(/[^0-9]/g, '')) || 0;
                    totalRev += num;
                }
            });
            document.getElementById('statRevenue').innerText = '₱ ' + totalRev.toLocaleString() + '.00';

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="empty-msg">No customer orders found in LocalStorage yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            orders.forEach((order, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${order.date || 'N/A'}</td>
                    <td><strong style="color: #fff;">${order.username || 'N/A'}</strong></td>
                    <td>${order.script || 'N/A'}</td>
                    <td>${order.duration || 'N/A'}</td>
                    <td style="color: #c084fc; font-weight: 600;">${order.price || 'N/A'}</td>
                    <td>${order.gcash || 'N/A'}</td>
                    <td>
                        ${order.proofImage ? `<img src="${order.proofImage}" class="proof-img" onclick="window.open('${order.proofImage}')" title="Click to view full receipt">` : 'No Image'}
                    </td>
                    <td><span style="color: #facc15; font-weight: 600; background: rgba(250, 204, 21, 0.1); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem;">${order.status || 'Pending'}</span></td>
                    <td><button class="btn-delete" onclick="deleteOrder(${index})">Delete</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        function deleteOrder(index) {
            if (confirm("Are you sure you want to delete this order record?")) {
                let orders = JSON.parse(localStorage.getItem('ericShopOrders')) || [];
                orders.splice(index, 1);
                localStorage.setItem('ericShopOrders', JSON.stringify(orders));
                loadOrders();
            }
        }
    </script>
</body>
</html>
