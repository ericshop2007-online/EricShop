<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Eric Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* === ULTRA PREMIUM UI OVERHAUL === */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #090a0f, #1a1c29, #4f195c, #2a0845);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease;
        }

        /* --- LOGIN OVERLAY --- */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            padding: 50px 40px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            transform: translateY(-20px);
            animation: floatUp 0.6s ease forwards;
        }

        @keyframes floatUp {
            to { transform: translateY(0); opacity: 1; }
        }

        .login-box h2 {
            margin-top: 0;
            color: #a855f7;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .login-box input {
            width: 100%; padding: 16px; margin: 25px 0; border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.3); background: rgba(0,0,0,0.4);
            color: white; font-size: 16px; outline: none; box-sizing: border-box;
            transition: 0.3s;
        }

        .login-box input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            background: rgba(0,0,0,0.6);
        }

        .login-box button {
            width: 100%; padding: 16px; background: linear-gradient(45deg, #8b5cf6, #6d28d9);
            color: white; border: none; border-radius: 12px; font-weight: 700; 
            font-size: 16px; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1.5px;
            box-shadow: 0 8px 20px rgba(109, 40, 217, 0.4);
        }

        .login-box button:hover { 
            background: linear-gradient(45deg, #9333ea, #7e22ce); 
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(109, 40, 217, 0.6);
        }

        /* --- NAVBAR --- */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: rgba(10, 10, 10, 0.7); 
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .logo { font-size: 1.8rem; font-weight: 700; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .badge { background: linear-gradient(45deg, #ef4444, #b91c1c); padding: 4px 10px; font-size: 12px; border-radius: 8px; margin-left: 8px; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        
        .btn-logout { 
            background: transparent; color: #ef4444; border: 1px solid #ef4444; 
            padding: 10px 25px; border-radius: 8px; cursor: pointer; text-decoration: none; 
            transition: 0.3s; font-weight: 600;
        }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.1); box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }

        /* --- DASHBOARD --- */
        .admin-wrapper { padding: 50px; max-width: 1400px; margin: 0 auto; }
        .admin-header { margin-bottom: 40px; }
        .admin-header h2 { color: #a855f7; margin-bottom: 10px; font-size: 2.5rem; text-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
        .admin-header p { color: #9ca3af; margin-top: 0; font-size: 1.1rem; }
        
        .table-container { overflow-x: auto; padding: 10px; border-radius: 20px; }
        .logs-table { width: 100%; border-collapse: collapse; text-align: left; }
        .logs-table th, .logs-table td { padding: 20px 25px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logs-table th { 
            text-transform: uppercase; font-size: 12px; color: #c084fc; 
            letter-spacing: 2px; background: rgba(0,0,0,0.4); font-weight: 700;
        }
        .logs-table th:first-child { border-top-left-radius: 12px; }
        .logs-table th:last-child { border-top-right-radius: 12px; }
        
        .logs-table tbody tr { transition: all 0.3s ease; }
        .logs-table tbody tr:hover { background: rgba(168, 85, 247, 0.05); transform: scale(1.01); }
        
        /* STATUS STYLES */
        .status-pending { color: #fbbf24; font-weight: 600; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }
        .status-pending::before { content: "•"; font-size: 24px; animation: pulse 1.5s infinite; }
        
        .status-approved { color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
        .status-approved::before { content: "•"; font-size: 24px; }

        .status-rejected { color: #ef4444; font-weight: 600; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
        .status-rejected::before { content: "•"; font-size: 24px; }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* ACTION BUTTONS */
        .btn-action { 
            padding: 10px 18px; border: none; border-radius: 8px; 
            cursor: pointer; font-weight: 700; font-size: 12px; 
            text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; 
        }
        
        .btn-view { background: linear-gradient(45deg, #3b82f6, #2563eb); color: white; margin-right: 8px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .btn-view:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); }
        
        .btn-approve { background: linear-gradient(45deg, #10b981, #059669); color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-approve:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }

        .btn-reject { background: linear-gradient(45deg, #ef4444, #b91c1c); color: white; margin-left: 8px; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .btn-reject:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5); }
        
        .text-muted { color: #6b7280; font-style: italic; font-weight: 300; }

        /* IMAGE MODAL */
        #imageModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 10000; 
            justify-content: center; align-items: center; flex-direction: column;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        #modalImage { max-width: 90%; max-height: 80vh; border-radius: 15px; border: 3px solid #a855f7; box-shadow: 0 0 40px rgba(168, 85, 247, 0.4); }
        .close-modal { margin-top: 25px; padding: 12px 30px; background: transparent; color: #fff; border: 2px solid #ef4444; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .close-modal:hover { background: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.8); }
    </style>
</head>
<body>
    
    <div id="imageModal">
        <img id="modalImage" src="" alt="Payment Receipt">
        <button class="close-modal" onclick="closeModal()">Close Image</button>
    </div>

    <div id="loginOverlay">
        <div class="login-box glass-panel">
            <h2>Admin Security</h2>
            <p style="color: #9ca3af; font-size: 14px;">Please authenticate to access the dashboard.</p>
            <input type="password" id="adminPassword" placeholder="Enter Password" onkeypress="handleEnter(event)">
            <!-- DITO KO NILAGAY YUNG ID PARA GUMANA ANG JAVASCRIPT -->
            <button id="adminLoginBtn" onclick="checkPassword()">Unlock Dashboard</button>
        </div>
    </div>
    
    <div id="adminContent" style="display: none;">
        <header class="navbar">
            <div class="logo">Eric Shop <span class="badge">ADMIN</span></div>
            <div class="nav-links">
                <a href="#" class="btn-logout" onclick="logout()">Logout / Lock</a>
            </div>
        </header>
        <main class="admin-wrapper">
            <div class="admin-header">
                <h2>Transaction Logs</h2>
                <p>Verify buyer payments, check uploaded screenshots, and manage order statuses.</p>
            </div>
            <div class="glass-panel table-container">
                <table class="logs-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Buyer Username</th>
                            <th>Script Purchased</th>
                            <th>Duration</th>
                            <th>Price</th>
                            <th>Proof of Payment</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        function handleEnter(e) { if (e.key === 'Enter') checkPassword(); }

        if (sessionStorage.getItem('adminUnlocked') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
        }

        function checkPassword() {
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('adminLoginBtn'); // NGAYON HINDI NA ITO MAG-EERROR
            btn.textContent = 'Checking...';

            // SIMPLE HARDCODED CHECK (PARA GUMANA KAHIT WALANG BACKEND SERVER)
            setTimeout(() => { 
                btn.textContent = 'Unlock Dashboard';
                
                // I-TYPE MO ANG "admin123" PARA MA-UNLOCK
                if (password === 'admin123') { 
                    sessionStorage.setItem('adminUnlocked', 'true');
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('adminContent').style.display = 'block';
                    loadOrders();
                } else {
                    alert('Invalid Admin Password!');
                }
            }, 500); // 500ms delay para kunwari naglo-loading
        }

        function logout() {
            sessionStorage.removeItem('adminUnlocked');
            location.reload();
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('adminUnlocked') === 'true') {
                loadOrders();
            }
        });

        // TABLE LOGIC
        function loadOrders() {
            const tbody = document.getElementById('adminTableBody');
            const orders = JSON.parse(localStorage.getItem('ericShopOrders')) || [];

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 40px; color: #b2bec3;">No pending orders found in the database.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            orders.forEach((order, index) => {
                
                let viewImageButton = order.proofImage 
                    ? `<button class="btn-action btn-view" onclick="openModal(${index})">📷 View Receipt</button>` 
                    : '<span style="color:#d63031; font-size:12px;">No Image</span>';

                tbody.innerHTML += `
                    <tr>
                        <td style="color: #b2bec3;">${order.date}</td>
                        <td style="color: #a29bfe; font-weight: bold;">${order.username}</td>
                        <td>${order.script}</td>
                        <td style="color: #fdcb6e;">${order.duration || 'N/A'}</td>
                        <td style="font-weight: 600;">${order.price}</td>
                        <td>${viewImageButton}</td>
                        <td><span class="${order.status === 'Approved' ? 'status-approved' : 'status-pending'}">${order.status}</span></td>
                        <td>
                            ${order.status === 'Pending' 
                                ? `<button class="btn-action btn-approve" onclick="approveOrder(${index})">Approve</button>` 
                                : '<span class="text-muted">Completed</span>'}
                        </td>
                    </tr>
                `;
            });
        }

        function approveOrder(index) {
            let orders = JSON.parse(localStorage.getItem('ericShopOrders')) || [];
            orders[index].status = 'Approved';
            localStorage.setItem('ericShopOrders', JSON.stringify(orders));
            loadOrders(); 
        }

        // MODAL LOGIC
        function openModal(index) {
            let orders = JSON.parse(localStorage.getItem('ericShopOrders')) || [];
            if(orders[index] && orders[index].proofImage) {
                document.getElementById('modalImage').src = orders[index].proofImage;
                document.getElementById('imageModal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
            document.getElementById('modalImage').src = "";
        }
    </script>
</body>
</html>
