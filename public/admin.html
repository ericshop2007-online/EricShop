<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Eric Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; color: #f0f0f0; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        .navbar { background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(139, 92, 246, 0.2); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .logo { font-size: 1.6rem; color: #fff; font-weight: 700; }
        .badge { background: linear-gradient(45deg, #8b5cf6, #5b21b6); padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; }
        .btn-home { background: transparent; border: 1px solid #8b5cf6; color: white; padding: 8px 20px; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: 600; transition: all 0.3s; }
        .btn-home:hover { background: rgba(139, 92, 246, 0.2); }
        
        .container { padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
        h2 { color: #fff; margin-bottom: 25px; font-weight: 700; }
        
        .table-wrapper { background: rgba(25, 25, 25, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .orders-table { width: 100%; border-collapse: collapse; text-align: left; }
        .orders-table th, .orders-table td { padding: 15px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.9rem; }
        .orders-table th { background: rgba(139, 92, 246, 0.1); color: #a855f7; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .orders-table tr:hover { background: rgba(255, 255, 255, 0.02); }
        
        .proof-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid #8b5cf6; transition: transform 0.2s; }
        .proof-img:hover { transform: scale(1.1); }
        
        .btn-delete { background: linear-gradient(45deg, #ef4444, #b91c1c); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: opacity 0.2s; }
        .btn-delete:hover { opacity: 0.8; }
        
        .empty-msg { text-align: center; padding: 40px; color: #888; font-size: 1rem; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">Eric Shop <span class="badge">ADMIN</span></div>
        <a href="/" class="btn-home">Home</a>
    </header>

    <div class="container">
        <h2>Customer Orders Dashboard</h2>
        <div class="table-wrapper">
            <div style="overflow-x: auto;">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Username</th>
                            <th>Script</th>
                            <th>Duration</th>
                            <th>Price</th>
                            <th>GCash #</th>
                            <th>Proof</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <!-- Orders are dynamically loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function loadOrders() {
            const tbody = document.getElementById('ordersTableBody');
            const orders = JSON.parse(localStorage.getItem('ericShopOrders')) || [];

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="empty-msg">No pending or completed orders found in LocalStorage.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            orders.forEach((order, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${order.date || 'N/A'}</td>
                    <td><strong style="color: #fff;">${order.username || 'N/A'}</strong></td>
                    <td>${order.script || 'N/A'}</td>
                    <td>${order.duration || 'N/A'}</td>
                    <td style="color: #a855f7; font-weight: 600;">${order.price || 'N/A'}</td>
                    <td>${order.gcash || 'N/A'}</td>
                    <td>
                        ${order.proofImage ? `<img src="${order.proofImage}" class="proof-img" onclick="window.open('${order.proofImage}')" title="Click to view full image">` : 'No Image'}
                    </td>
                    <td><span style="color: #facc15; font-weight: 600; background: rgba(250, 204, 21, 0.1); padding: 4px 10px; border-radius: 6px;">${order.status || 'Pending'}</span></td>
                    <td><button class="btn-delete" onclick="deleteOrder(${index})">Delete</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        function deleteOrder(index) {
            if (confirm("Are you sure you want to delete this order?")) {
                let orders = JSON.parse(localStorage.getItem('ericShopOrders')) || [];
                orders.splice(index, 1);
                localStorage.setItem('ericShopOrders', JSON.stringify(orders));
                loadOrders();
            }
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
