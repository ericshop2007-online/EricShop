<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Eric Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f2027;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            padding: 40px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .login-box h2 {
            margin-top: 0;
            color: #6c5ce7;
            margin-bottom: 10px;
        }
        .login-box input {
            width: 100%; padding: 15px; margin: 20px 0; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2);
            color: white; font-size: 16px; outline: none; box-sizing: border-box;
        }
        .login-box button {
            width: 100%; padding: 15px; background: #6c5ce7; color: white; border: none;
            border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        .login-box button:hover { background: #a29bfe; box-shadow: 0 0 15px rgba(108, 92, 231, 0.5); }
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { font-size: 24px; font-weight: 700; }
        .badge { background: #d63031; padding: 3px 8px; font-size: 12px; border-radius: 5px; margin-left: 5px; }
        .btn-logout { background: transparent; color: white; border: 1px solid #d63031; padding: 8px 20px; border-radius: 5px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .btn-logout:hover { background: #d63031; }
        .admin-wrapper { padding: 40px; max-width: 1200px; margin: 0 auto; }
        .admin-header { margin-bottom: 30px; }
        .admin-header h2 { color: #a29bfe; margin-bottom: 5px; }
        .admin-header p { color: #b2bec3; margin-top: 0; }
        .table-container { overflow-x: auto; }
        .logs-table { width: 100%; border-collapse: collapse; text-align: left; }
        .logs-table th, .logs-table td { padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logs-table th { text-transform: uppercase; font-size: 13px; color: #a29bfe; letter-spacing: 1px; background: rgba(0,0,0,0.2); }
        .logs-table tbody tr:hover { background: rgba(255,255,255,0.02); }
        .status-pending { color: #fdcb6e; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .status-pending::before { content: "•"; font-size: 20px; }
        .status-approved { color: #00b894; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .status-approved::before { content: "•"; font-size: 20px; }
        .btn-action { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-approve { background: #00b894; color: white; }
        .btn-approve:hover { background: #00e6b8; box-shadow: 0 0 10px rgba(0, 184, 148, 0.4); }
        .btn-view { background: #0984e3; color: white; margin-right: 5px;}
        .btn-view:hover { background: #74b9ff; }
        .text-muted { color: #636e72; font-style: italic; }

        #imageModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; flex-direction: column;
        }
        #modalImage { max-width: 90%; max-height: 80vh; border-radius: 10px; border: 2px solid #a29bfe; }
        .close-modal { margin-top: 20px; padding: 10px 20px; background: #d63031; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    
    <div id="imageModal">
        <img id="modalImage" src="" alt="Payment Receipt">
        <button class="close-modal" onclick="closeModal()">Close Image</button>
    </div>

    <div id="loginOverlay">
        <div class="login-box glass-panel">
            <h2>Admin Security</h2>
            <p style="color: #b2bec3; font-size: 14px;">Enter password (default: admin123)</p>
            <input type="password" id="adminPassword" placeholder="Enter Password" onkeypress="handleEnter(event)">
            <button onclick="checkPassword()">Unlock Dashboard</button>
        </div>
    </div>
    
    <div id="adminContent" style="display: none;">
        <header class="navbar">
            <div class="logo">Eric Shop <span class="badge">ADMIN</span></div>
            <div class="nav-links">
                <a href="#" class="btn-logout" onclick="logout()">Logout / Lock</a>
            </div>
        </header>
        <main class="admin-wrapper">
            <div class="admin-header">
                <h2>Transaction Logs</h2>
                <p>Verify buyer payments by checking their uploaded screenshots.</p>
            </div>
            <div class="glass-panel table-container">
                <table class="logs-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Buyer Username</th>
                            <th>Script Purchased</th>
                            <th>Duration</th>
                            <th>Price</th>
                            <th>Proof of Payment</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                    </tbody>
                </table>
            </div>
        </main>
    </div>
